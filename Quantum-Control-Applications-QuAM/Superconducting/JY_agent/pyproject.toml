[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jy-qubit-agent"
version = "0.1.0"
description = "Policy-gated MCP agent for superconducting-qubit bring-up"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "tomli>=2.0; python_version < '3.11'",
    # Preserve compatibility with the FastAPI version in qualibrate_env.
    "starlette>=0.40,<0.47",
    "sse-starlette>=3.0,<3.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
jy-agent = "jy_agent.cli:main"
jy-agent-server = "jy_agent.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
