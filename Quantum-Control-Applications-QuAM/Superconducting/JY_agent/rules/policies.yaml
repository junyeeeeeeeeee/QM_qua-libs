      frequency_detuning_in_mhz: "positive_number"
      min_wait_time_in_ns: "positive_int"
      max_wait_time_in_ns: "positive_int"
      num_time_points: "positive_int"
      log_or_linear_sweep: "linear_log_literal"
      use_state_discrimination: "bool"
