version: 1

protected_paths:
  - "calibration_graph"
  - "Script"

approval:
  run_ttl_minutes: 60
  state_commit_ttl_minutes: 60
  max_auto_retries_per_approval: 2
  require_interactive_tty: true

# One human approval delegates only the bounded actions below. A null total-run
# limit is intentional; the per-(node, qubit) attempt limit remains mandatory.
autonomy:
  # Default budget when automatic-mode entry does not name one.
  duration_hours: 8
  # Operator instruction 2026-09-20: entry may request a different budget for
  # that session, because a ten-qubit bring-up through the statistics nodes
  # does not fit in eight hours. The human still approves the actual number on
  # the Dashboard; this is the ceiling an agent may ask for.
  max_duration_hours: 24
  max_total_runs: null
  max_attempts_per_node_qubit: 20
  auto_state_commit_analysis_statuses: ["pass"]
  # Operator instruction 2026-09-20. A run whose overall analysis_status is
  # `needs_review` may still commit the subset of qubits that individually
  # passed every check, because the node refuses a further run once a target is
  # resolved and the calibrated value would otherwise be lost for good. Only
  # per-target passing evidence is ever committed; a failure that belongs to the
  # run as a whole still blocks every target. Set to false to restore the
  # older all-or-nothing behaviour.
  partial_pass_state_commit: true
  pause_on_analysis_statuses: []
  emergency_stop_grace_seconds: 30
  watchdog_interval_seconds: 2
  # Operator instruction 2026-09-20. A refusal that happens before the worker
  # reaches hardware is a correctable planning error, not a loss of control:
  # nothing ran, so refusing the action is the whole protection and ending the
  # lease only costs a new human approval. `parameter_policy_violation` and
  # out-of-scope requests therefore no longer halt; they are refused and
  # recorded. An unrecognized worker exception now pauses the lease for the
  # operator (resumable with `恢復量測`) instead of ending it. Only the
  # conditions below, which all mean JY can no longer account for the hardware
  # or the state file, still halt.
  halt_conditions:
    - "snapshot_missing"
    - "state_hash_conflict"
    - "hardware_lock_anomaly"
  # Operator instruction 2026-09-20. A QMTimeoutError is not by itself an
  # outage. The worker separates three causes before deciding whether to stop:
  # a program too large to submit (the deadline expired in a `qm` frame that
  # submits a program, the gRPC status was DEADLINE_EXCEEDED, and a probe right
  # after the failure got the QOP to answer a health check), a wedged or dead
  # QOP, and a network fault. Only the first keeps the lease running, and only
  # while more than one target was attempted, so the agent can halve the
  # multiplex group without an operator. See `rules/PLAYBOOK.md`, "Halve the
  # multiplex group when a run times out on submission".
  multiplex_submission_timeout:
    halving_ladder: "all -> half -> half again -> single"
    keep_lease_active: true
    escalate_at_single_target: true
  # A worker exception matching one of these signatures is a parameter the
  # protected node itself rejects: deterministic, reproducible, and fixed by
  # choosing a different value. The lease stays active so the agent can correct
  # the parameter; it must never resend the value that crashed. Every other
  # worker exception pauses the lease for the operator. Add an entry only
  # together with its `rules/experiences/<node>.md` lesson.
  recoverable_worker_exceptions:
    - id: "02c_fractional_power_limits"
      nodes: ["02c"]
      exception_types: ["ValidationError"]
      message_markers: ["int_from_float", "min_power_dbm", "max_power_dbm"]
      parameters: ["min_power_dbm", "max_power_dbm"]
      remedy: >-
        02c types min_power_dbm/max_power_dbm as int. Use whole-number dBm
        limits and change the integer window width or num_power_points instead
        of a fractional endpoint.
    - id: "03a_arbitrary_frequency_before_flux_calibration"
      nodes: ["03a"]
      exception_types: ["ZeroDivisionError"]
      message_markers: ["float division by zero"]
      parameters: ["arbitrary_qubit_frequency_in_ghz"]
      remedy: >-
        freq_vs_flux_01_quad_term is still zero this early in bring-up. Move the
        scan with jy_request_03a_candidate_center or
        jy_request_03a_window_shift, which only touch LO and IF.
    # Operator decision 2026-09-20, after run
    # 450064c6223f4f16bb1f71d6dbb15efc: the program was submitted and executed,
    # then the QOP failed while streaming results back. A probe immediately
    # afterwards completed a cluster health check, so the instrument was
    # healthy. Treat it like an oversized program on the downstream side and
    # halve the multiplex group, exactly as for a submission timeout.
    - id: "fetch_stage_data_fetching_error"
      nodes: []
      exception_types: ["DataFetchingError"]
      message_markers: ["unexpected error in rpc handling"]
      parameters: ["qubits"]
      remedy: >-
        The QOP accepted and ran the program but failed to stream the results
        back. Halve the multiplex group and repeat the node, continuing to
        halve on further failures; a single target that still fails this way
        is not a data-volume problem and goes to the operator.

# Thermal reset is the safe default everywhere. Active reset is evidence-gated
# per qubit by an active-reset 07b run with compact clouds and >= 85% fidelity.
# If active reset is used for statistics, all three lifetime baselines must be
# repeated and accepted with active reset before any statistics node may start.
reset_policy:
  default_type: "thermal"
  active_qualification_node: "07b"
  active_min_readout_fidelity: 0.80
  active_statistics_verification_nodes: ["05", "06", "06b"]
  # Operator choice 2026-10-04: after 07b, qubits qualified by an accepted
  # active-reset 07b run use active reset at every later node with a reset
  # parameter (06, 06b, 10a, statistics); the rest stay thermal. Each group
  # has its own shared first batch and the two never share a run.
  group_by_reset_after_qualification: true

# Operator instruction 2026-09-22. Some chips route the XY drive of several
# qubits to a single OPX output. Such a line cannot address one qubit without
# also illuminating its neighbours, it needs high drive power or long gates to
# move any of them, and its LO is shared, so placing one qubit at zero IF moves
# every other qubit on the port. The trigger is the wiring file itself: any two
# qubits sharing `wiring.qubits.<q>.xy.opx_output`.
#
# On such a chip the workflow stops being a node-by-node sweep over all targets
# and becomes a qubit-by-qubit pass: 02, 02x, 02c and 02a still multiplex every
# active target because they only use the readout line, and from
# `serialize_from_node` the workflow takes ONE qubit through the whole remaining
# sequence -- to the end, or until that qubit is scientifically unmeasurable or
# out of attempts -- and only then returns to `serialize_from_node` for the next
# qubit. That is what makes a shared LO safe: the drive LO only moves between
# passes, never inside one.
shared_xy_drive:
  serialize_from_node: "03a"
  per_qubit_pass: true
  max_multiplex_targets: 1

# Operator request 2026-10-04. The autonomy-lease approval page lists these
# nodes as checkboxes (ticked by default); an unticked node is left out of that
# workflow's sequence and of the lease, so the workflow goes straight past it.
# The same page asks for the measurement mode from
# `shared_xy_drive.serialize_from_node` on: `per_qubit` (one qubit through the
# whole tail at a time; recommended when the wiring shares an XY output) or
# `multiplex`. Automatic measurement starts only after that choice; the mode is
# fixed for the rest of the workflow.
workflow_options:
  optional_nodes: ["02", "05st", "06st_t2star", "06st_t2e"]

instrument_limits:
  qubit_if_abs_hz: 400000000
  resonator_if_abs_hz: 400000000
  max_sweep_points: 20001
  max_num_averages: 100000
  mw:
    max_wf_amplitude: 1.0
    max_x180_wf_amplitude: 1.0
  iq:
    max_wf_amplitude: 0.5
    max_x180_wf_amplitude: 0.3
  bootstrap_x180_fraction: 0.5
  bootstrap_x90_fraction_of_x180: 0.5
  opx1000_full_scale_power_dbm:
    min: -11
    max: 16
  mw_upconverter_frequency_hz:
    min: 2000000000
    max: 18000000000
  # Operator instruction 2026-09-22. An LO placed near a band edge is a
  # hardware error waiting to happen, so every upconverter frequency must stay
  # at least `mw_band_edge_margin_hz` inside the band its port is configured
  # for. These are the OPX1000 MW-FEM band ranges; correct them here if a
  # future firmware widens them.
  mw_band_frequency_hz:
    1: {min: 50000000, max: 5500000000}
    2: {min: 4500000000, max: 7500000000}
    3: {min: 6500000000, max: 10500000000}
  mw_band_edge_margin_hz: 100000000
  drive_lo_grid_hz: 100000000
  multiplex:
    max_qubits_per_run: 10
    max_qubits_per_readout_line: 5
    min_resonator_spacing_hz: 1000000
    max_aggregate_readout_amplitude: 0.5

analysis:
  resonator:
    # Operator-supplied RF is already close. 02x/02c/02a only fine-tune.
    max_frequency_span_mhz: 60.0
    # Protected-node fits treat the readout LO (IF=0, detuning −IF) as a peak.
    upconverter_exclusion_hz: 1000000.0
  statistics:
    # One requested statistics run contains 100 repetitions. Its raw iterations
    # are not re-fitted or used as an additional all-or-nothing acceptance gate.
    required_repetitions: 100
  "02x":
    # Visible interior dip is enough; 02x only fine-tunes stored resonator RF.
    min_robust_snr: 3.0
  "02a":
    # Visible interior dressed dip is enough after 02c has set the point.
    min_robust_snr: 3.0
  "04":
    # q3/q4/q5 reference run: 14.86 / 24.73 / 26.91 at 500 averages.
    # Operator instruction 2026-09-20: lowered from 14.0. A Power Rabi trace
    # with a clean single oscillation and a finite interior Pi fit is already
    # correct well below that anchor; q2 sat at 9.57 with a textbook curve.
    min_robust_snr: 7.0
    noise_confirmation_num_averages: [500, 1000, 2000, 4000]
    max_noise_confirmation_num_averages: 4000
  "05":
    # q3/q4/q5 reference run: 25.06 / 52.19 / 62.50 at 2000 averages.
    min_robust_snr: 25.0
    noise_confirmation_num_averages: [2000, 4000, 8000]
    max_noise_confirmation_num_averages: 8000
  "07b":
    min_readout_fidelity: 0.70
    # Operator instruction 2026-09-21: a thermal 07b result above this
    # fidelity earns one active-reset repeat, and that repeat qualifies the
    # qubit for active reset downstream. One number governs both, so the
    # trigger and the qualification floor are deliberately the same.
    active_reset_min_readout_fidelity: 0.80
    active_reset_trigger_fidelity: 0.80
    # 07b is single-pass, so morphology is no longer a gate at this node and
    # must not silently block active-reset qualification either. Set this back
    # to true to restore the compact-cloud requirement for qualification.
    active_reset_requires_morphology: false
    # Operator instruction 2026-10-02: judge the IQ clouds as two blobs.
    # Shots on the other blob are readout errors (thermal population, decay)
    # and are counted by fidelity; a cloud fails only when more than
    # `two_blob_max_outlier_fraction` of its shots lie beyond
    # `two_blob_outlier_sigma` of both blob centres (2D Gaussian: 1.1% at 3).
    # The radius-quantile limits below are reported as advisory notes.
    morphology_mode: "two_blob"
    two_blob_outlier_sigma: 3.0
    two_blob_max_outlier_fraction: 0.05
    max_cloud_axis_ratio: 4.0
    max_p95_to_median_radius: 4.0
    max_p99_to_median_radius: 4.0
    min_cloud_samples: 1000
    tail_retry_amplitude_factor: 0.7071067811865476
    min_readout_amplitude: 0.005
  "07d":
    # Operator instruction 2026-10-02: pick the highest fidelity among points
    # whose g/e shots, pooled over +-`neighborhood_points` in frequency and
    # amplitude, have at most `max_outlier_fraction` beyond `outlier_sigma` of
    # both blob centres.
    outlier_sigma: 3.0
    max_outlier_fraction: 0.03
    neighborhood_points: 1
    # Operator choice 2026-10-03: never above the 02c dressed-limit power, and
    # prefer the two-blob point only when it costs at most this much fidelity
    # (percentage points); otherwise keep the fidelity optimum for 07b to judge.
    fidelity_tolerance_percent: 2.0
  "03a":
    initial_coarse_span_mhz: 800.0
    initial_coarse_operation_amplitude_factor: 0.10
    coarse_min_span_mhz: 200.0
    # Do not chase 40–50 MHz windows; ~200 MHz is enough for refinement/fine.
    refinement_max_span_mhz: 200.0
    refinement_max_operation_amplitude_factor: 0.10
    final_max_span_mhz: 200.0
    final_max_operation_amplitude_factor: 0.05
    final_min_feature_fwhm_mhz: 0.5
    # Allow a moderately power-broadened fine peak; still reject ~20 MHz blobs.
    final_max_feature_fwhm_mhz: 16.0
    # Visible peak above noise; 5.25 was a documented noise-dominated miss.
    min_robust_snr: 6.0
    min_edge_fraction: 0.05
    two_photon_detection_min_operation_amplitude_factor: 0.075
    two_photon_pair_min_separation_mhz: 50.0
    two_photon_pair_max_separation_mhz: 150.0
    two_photon_lower_max_width_ratio: 0.60
    two_photon_min_peak_snr: 3.0
    two_photon_peak_min_distance_mhz: 10.0
    noise_confirmation_num_averages: [500, 1000, 2000]
    max_noise_confirmation_num_averages: 2000
  "02c":
    # Operator instruction 2026-10-02: read out 10 dB below the dressed
    # boundary, so 07d/07b start well clear of the bare-resonator transition.
    readout_power_backoff_db: 10.0
    # Each readout line's full scale is the smallest integer that keeps every
    # pulse at or below this amplitude (07d's max_readout_amplitude) and the
    # line's summed amplitude at or below
    # instrument_limits.multiplex.max_aggregate_readout_amplitude.
    max_readout_pulse_amplitude: 0.125
    plateau_tail_fraction: 0.20
    min_plateau_points: 4
    # Accept a slightly wander-y plateau when dressed/bare remain distinct.
    plateau_min_coverage: 0.55
    min_frequency_separation_steps: 4.0
    plateau_band_steps: 4.0
    plateau_band_fraction_of_separation: 0.25
    max_plateau_width_steps: 8.0
    max_plateau_width_fraction_of_separation: 0.55
    min_depletion_points: 2
    min_transition_monotonic_fraction: 0.70
    transition_monotonic_slack_fraction: 0.10
    # Telling dressed from bare is the whole acceptance test. Each frequency
    # must own this many consecutive classifiable power points.
    min_classified_plateau_points: 2
    # Operator rule (2026-09-18): the metrics below stay reported as advisory
    # notes and no longer reject a run on their own. Set one to true to make it
    # blocking again.
    require_plateau_stability: false
    require_plateau_width: false
    require_depletion_points: false
    require_transition_monotonic: false
    frequency_edge_fraction: 0.05
    selected_power_tolerance_steps: 2.0
    smoothing_window_points: 3
    bare_only_max_trace_width_steps: 2.0
    bare_only_bare_match_steps: 3.0
    bare_only_required_min_power_dbm: -50.0
    bare_only_max_frequency_span_mhz: 10.0
    bare_only_max_frequency_step_mhz: 0.1
    bare_only_min_num_averages: 200
    bare_only_min_readout_length_ns: 1000
    bare_only_min_low_power_snr: 5.0
    bare_only_min_power_points: 30
    # Operator rule 2026-10-05: a pass needs the frequency window to be about
    # 2-5x the bare-dressed separation, so the dressed-to-bare shift is visible
    # in the plot. A wider window fails and is rescanned narrower, centred
    # between dressed and bare (jy_request_02c_window_recenter).
    min_window_to_separation_ratio: 2.0
    max_window_to_separation_ratio: 5.0
    recommended_window_to_separation_ratio: 3.5
    # A smeared or unstable low-power dressed plateau (q7 2026-10-05: a noise
    # band below -44 dBm read as dressed) blocks; rescan with a shifted power
    # window.
    require_dressed_plateau_quality: true
    # The power window may be shifted but always spans this many dB.
    power_window_db: 40
    max_num_power_points: 30
    max_num_averages: 100

usage:
  # Operator request 2026-10-03: Dashboard usage page. Claude Code transcripts
  # are read from ~/.claude/projects/<repository slug>/ unless transcript_dir
  # is set here. Only token counts are read.
  transcript_dir: null
  pricing:
    # Estimated cost at Anthropic API list prices (USD per million tokens,
    # cached 2026-09-25). A Claude subscription plan is billed differently;
    # this is the API-equivalent cost. Correct the numbers here if prices change.
    cache_write_5m_multiplier: 1.25
    cache_write_1h_multiplier: 2.0
    fast_multiplier: 2.0
    models:
      claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20}
      claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.20}
      claude-fable-5-1: {input: 10.0, output: 50.0, cache_read: 0.25}
      claude-haiku-4-5: {input: 1.0, output: 5.0, cache_read: 0.10}

state_commit:
  allowed_json_pointer_patterns:
    - "^/ports/mw_outputs/[^/]+/[0-9]+/[0-9]+/upconverter_frequency$"
    # Only 02c writes this: its JY patch derives the readout-line full scale.
    - "^/ports/mw_outputs/[^/]+/[0-9]+/[0-9]+/full_scale_power_dbm$"
    - "^/qubits/q[0-9]+/xy/intermediate_frequency$"
    - "^/qubits/q[0-9]+/xy/operations/[A-Za-z0-9_-]+/amplitude$"
    - "^/qubits/q[0-9]+/resonator/intermediate_frequency$"
    # `length` is 07d's readout-duration output; the others predate it.
    - "^/qubits/q[0-9]+/resonator/operations/readout/(amplitude|full_scale_power_dbm|integration_weights_angle|length)$"
    - "^/qubits/q[0-9]+/resonator/operations/readout/(threshold|rus_exit_threshold)$"
    - "^/qubits/q[0-9]+/resonator/confusion_matrix$"
    - "^/qubits/q[0-9]+/extras/(bare_resonator_freq|idle_freq|dressed_resonator_freq)$"
    - "^/qubits/q[0-9]+/extras/(readout_fidelity|T1|T1_dev|T2ramsey|T2ramsey_dev|T2|T2_dev)$"
    - "^/qubits/q[0-9]+/T1$"
    - "^/qubits/q[0-9]+/T2(ramsey|echo)$"
  allowed_operations: ["add", "replace"]
  require_base_hash_match: true
  always_require_human_approval: true

nodes:
  # Operator request 2026-10-04: broadband survey ahead of 02x. One sweep per
  # readout MW input over LO +/- max_if_in_mhz; it removes the electrical delay
  # and lists resonator candidates. Without res_design_freq it is a survey and
  # writes nothing; with it, only qubits whose candidate lies within
  # design_match_tolerance_in_mhz of the globally shifted design move their
  # readout IF. It is an optional node the operator ticks on the lease page,
  # and it runs once with the workflow targets and moves on.
  "02":
    name: "02_Broadband_Spectroscopy"
    script: "02_Broadband_Spectroscopy.py"
    flux_behavior: "hardcoded_min"
    single_pass: true
    # Its result never blocks the workflow; 02x always follows.
    advisory: true
    defaults:
      num_averages: 100
      max_if_in_mhz: 400.0
      frequency_step_in_mhz: 0.1
      readout_length_in_ns: 2000
      readout_power_dbm: null
      res_num: null
      res_design_freq: null
      design_match_tolerance_in_mhz: 10.0
      baseline_window_in_mhz: 15.0
      min_resonator_separation_in_mhz: 5.0
      lo_guard_in_mhz: 10.0
      min_linewidth_in_mhz: 0.3
      detection_snr: 6.0
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      max_if_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      readout_length_in_ns: "positive_int"
      readout_power_dbm: "optional_number"
      res_num: "optional_positive_int"
      res_design_freq: "optional_positive_number_list"
      design_match_tolerance_in_mhz: "positive_number"
      baseline_window_in_mhz: "positive_number"
      min_resonator_separation_in_mhz: "positive_number"
      lo_guard_in_mhz: "nonnegative_number"
      min_linewidth_in_mhz: "positive_number"
      detection_snr: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"

  "02x":
    name: "02x_Bare_Resonator_Spectroscopy"
    script: "02x_Bare_Resonator_Spectroscopy.py"
    flux_behavior: "hardcoded_min"
    defaults:
      num_averages: 300
      frequency_span_in_mhz: 20.0
      frequency_step_in_mhz: 0.05
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
      multiplexed: false
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"
      multiplexed: "bool"

  "02a":
    name: "02a_Resonator_Spectroscopy"
    script: "02a_Resonator_Spectroscopy.py"
    flux_behavior: "hardcoded_min"
    defaults:
      num_averages: 300
      frequency_span_in_mhz: 20.0
      frequency_step_in_mhz: 0.05
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
      multiplexed: false
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"
      multiplexed: "bool"

  "02c":
    name: "02c_Resonator_Spectroscopy_vs_Amplitude"
    script: "02c_resonator_spectroscopy_vs_amplitude.py"
    flux_behavior: "joint"
    defaults:
      num_averages: 100
      frequency_span_in_mhz: 16.0  # first pass finds the separation; retries narrow to 2-5x
      frequency_step_in_mhz: 0.03
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      max_power_dbm: -10
      min_power_dbm: -50
      num_power_points: 30
      max_amp: 0.5
      flux_point_joint_or_independent: "joint"
      ro_line_attenuation_dB: 0.0
      derivative_crossing_threshold_in_hz_per_dbm: -50000
      derivative_smoothing_window_num_points: 30
      moving_average_filter_window_num_points: 30
      multiplexed: false
      load_data_id: null
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      # The protected node's Parameters model types both as `int`; a fractional
      # dBm is rejected by pydantic (`int_from_float`) before anything runs.
      max_power_dbm: "int"
      min_power_dbm: "int"
      num_power_points: "positive_int"
      max_amp: "positive_number"
      flux_point_joint_or_independent: "joint_literal"
      ro_line_attenuation_dB: "number"
      derivative_crossing_threshold_in_hz_per_dbm: "number"
      derivative_smoothing_window_num_points: "positive_int"
      moving_average_filter_window_num_points: "positive_int"
      multiplexed: "bool"
      load_data_id: "optional_positive_int"

  "03a":
    name: "03a_Qubit_Spectroscopy"
    script: "03a_Qubit_Spectroscopy.py"
    flux_behavior: "joint"
    defaults:
      num_averages: 100
      operation: "saturation"
      operation_amplitude_factor: 0.10
      operation_len_in_ns: 50000
      frequency_span_in_mhz: 800.0
      frequency_step_in_mhz: 1.0
      flux_point_joint_or_independent: "joint"
      target_peak_width: 1000000.0
      arbitrary_flux_bias: null
      arbitrary_qubit_frequency_in_ghz: null
      simulate: false
